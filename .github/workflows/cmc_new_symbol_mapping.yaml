name: cmc-new-symbol-mapping

on:
  schedule:
    # After daily-update (02:00 UTC) has refreshed the snapshots.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "resolve = map new symbols and open a PR · preview = map and report but change nothing · coverage = only count what is missing an ID (offline, seconds) · check-llm = only test the LLM endpoint"
        required: false
        type: choice
        default: resolve
        options:
          - resolve
          - preview
          - coverage
          - check-llm
      days:
        description: "How many days back to look (resolve/preview: symbols first listed in this window; coverage: rows counted)"
        required: false
        default: "60"
      exchanges:
        description: "Which snapshots to scan, comma-separated"
        required: false
        default: "binance-futures"
      max-llm-symbols:
        description: "Most symbols the LLM may be asked about in one run (a backlog needs a higher cap)"
        required: false
        default: "100"

permissions:
  contents: write
  pull-requests: write
  # No models: read -- GitHub Models is being retired and answers 410 Gone to
  # every request, so the inference permission it existed for grants nothing.

concurrency:
  group: cmc-new-symbol-mapping
  cancel-in-progress: false

env:
  PR_LABEL: cmc-mapping

jobs:
  map-new-symbols:
    # Binance answers 451 to GitHub-hosted runner IPs, so use the same runner
    # daily-update uses for its Binance calls.
    runs-on: ubicloud-standard-2

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup-uv
        uses: astral-sh/setup-uv@v5

      - name: install-dependencies
        run: uv pip install --system -e .

      - name: prepare-run
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "REPORT_PATH=${RUNNER_TEMP}/cmc-new-symbols-report.md" >> "$GITHUB_ENV"
          echo "SUMMARY_PATH=${RUNNER_TEMP}/cmc-new-symbols-summary.json" >> "$GITHUB_ENV"
          # Each run gets its own branch, so nothing a reviewer pushes is ever
          # overwritten and a stalled review never blocks the next run.
          # run_attempt keeps a re-run of a failed job from colliding with the
          # branch its first attempt already pushed.
          echo "RUN_BRANCH=automation/cmc-new-symbols-$(date -u +%Y%m%d)-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
          # Tickers already awaiting review in an open PR must not be proposed
          # twice. Read each open PR's decision ledger rather than its text.
          branches="${RUNNER_TEMP}/open-pr-branches.txt"
          if ! gh pr list --state open --label "${PR_LABEL}" --json headRefName --jq '.[].headRefName' > "${branches}"; then
            echo "::warning::could not list open ${PR_LABEL} pull requests; tickers already awaiting review may be proposed again"
            : > "${branches}"
          fi
          mkdir -p "${RUNNER_TEMP}/pending"
          pending_args=""
          index=0
          while read -r branch; do
            [ -n "${branch}" ] || continue
            git fetch origin "${branch}" >/dev/null 2>&1 || continue
            store="${RUNNER_TEMP}/pending/${index}.json"
            if git show "FETCH_HEAD:atlas/data/cmc_mappings.json" > "${store}" 2>/dev/null; then
              pending_args="${pending_args} --pending-mapping-path ${store}"
              index=$((index + 1))
            else
              rm -f "${store}"
            fi
          done < "${branches}"
          echo "PENDING_ARGS=${pending_args}" >> "$GITHUB_ENV"
          echo "Found ${index} open ${PR_LABEL} pull request(s) with a decision ledger"
          # A scheduled run sends no inputs, so resolve the default once here
          # rather than repeating a fallback in every later condition.
          echo "mode=${{ inputs.mode || 'resolve' }}" >> "$GITHUB_OUTPUT"

      - name: check-llm-endpoint
        if: steps.prepare.outputs.mode == 'check-llm'
        env:
          # GITHUB_TOKEN is deliberately not exported here: it is a repository
          # write credential, and the only endpoint that ever authenticated with
          # it is retired. Unset, the default reaches Zen's free tier.
          ATLAS_LLM_API_KEY: ${{ secrets.ATLAS_LLM_API_KEY }}
          ATLAS_LLM_BASE_URL: ${{ vars.ATLAS_LLM_BASE_URL }}
          ATLAS_LLM_MODEL: ${{ vars.ATLAS_LLM_MODEL }}
          ATLAS_LLM_API_VERSION: ${{ vars.ATLAS_LLM_API_VERSION }}
          # Seconds between requests. A free tier with a requests-per-minute
          # ceiling needs this raised: the 1s default paces at 60/min, which is
          # three times OpenRouter's free limit of 20/min.
          ATLAS_LLM_MIN_INTERVAL_SECONDS: ${{ vars.ATLAS_LLM_MIN_INTERVAL_SECONDS }}
        run: uv run python integrations/cmc_new_symbol_mapping.py --check-llm

      - name: resolve-new-binance-symbols
        id: resolve
        if: steps.prepare.outputs.mode != 'check-llm'
        env:
          # Any OpenAI-compatible endpoint works; unset reaches opencode Zen's
          # free tier, which needs no key. GITHUB_TOKEN is deliberately absent:
          # see check-llm-endpoint above.
          ATLAS_LLM_API_KEY: ${{ secrets.ATLAS_LLM_API_KEY }}
          ATLAS_LLM_BASE_URL: ${{ vars.ATLAS_LLM_BASE_URL }}
          ATLAS_LLM_MODEL: ${{ vars.ATLAS_LLM_MODEL }}
          # Only a GitHub-hosted endpoint wants this; others ignore it.
          ATLAS_LLM_API_VERSION: ${{ vars.ATLAS_LLM_API_VERSION }}
          # Seconds between requests. A free tier with a requests-per-minute
          # ceiling needs this raised: the 1s default paces at 60/min, which is
          # three times OpenRouter's free limit of 20/min.
          ATLAS_LLM_MIN_INTERVAL_SECONDS: ${{ vars.ATLAS_LLM_MIN_INTERVAL_SECONDS }}
          EXCHANGES: ${{ inputs.exchanges || 'binance-futures' }}
          DAYS: ${{ inputs.days || '60' }}
          MAX_LLM_SYMBOLS: ${{ inputs.max-llm-symbols || '100' }}
          MODE: ${{ steps.prepare.outputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            coverage)
              # Offline staleness check: no CoinMarketCap, no Binance, no LLM, no PR.
              extra_args="--coverage-only"
              ;;
            preview)
              extra_args="${PENDING_ARGS} --dry-run"
              ;;
            *)
              extra_args="${PENDING_ARGS}"
              ;;
          esac
          uv run python integrations/cmc_new_symbol_mapping.py \
            --exchanges "${EXCHANGES}" \
            --new-within-days "${DAYS}" \
            --max-llm-symbols "${MAX_LLM_SYMBOLS}" \
            --report-path "${REPORT_PATH}" \
            --summary-path "${SUMMARY_PATH}" \
            ${extra_args}
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open(os.environ["SUMMARY_PATH"]) as summary_file:
              summary = json.load(summary_file)


          def rendered(value):
              """Emit a step output a workflow condition can actually compare.

              json.dumps would wrap a string in quote characters, so
              `llm_status` arrived as `"unavailable"` and never equalled
              `unavailable` -- which left the fail-on-a-broken-LLM step inert.
              """
              if isinstance(value, str):
                  return value.replace("\n", " ").strip()
              return json.dumps(value)


          keys = (
              "new_symbols",
              "approved",
              "uncertain",
              "unmapped",
              "has_changes",
              "mapping_conflicts",
              "catalogue_complete",
              "catalogue_trustworthy",
              "exchange_prices_available",
              "llm_status",
              "worth_reviewing",
              "coverage_only",
              "window_days",
              "rows_in_window_missing_cmc_id",
          )
          for key in keys:
              if key in summary:
                  print(f"{key}={rendered(summary[key])}")
          PY

      - name: commit-and-push-decisions
        id: push
        if: steps.resolve.outputs.has_changes == 'true' && steps.resolve.outputs.worth_reviewing == 'true' && steps.prepare.outputs.mode == 'resolve'
        env:
          APPROVED: ${{ steps.resolve.outputs.approved }}
          UNCERTAIN: ${{ steps.resolve.outputs.uncertain }}
          UNMAPPED: ${{ steps.resolve.outputs.unmapped }}
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${RUN_BRANCH}"
          git add atlas/data
          if git diff --cached --quiet; then
            echo "No snapshot or mapping changes to commit"
            exit 0
          fi
          git commit \
            --message "chore(data): map new binance symbols to cmc ids" \
            --message "approved=${APPROVED} uncertain=${UNCERTAIN} unmapped=${UNMAPPED}"
          for attempt in 1 2 3 4; do
            if git push -u origin "${RUN_BRANCH}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "::error::could not push ${RUN_BRANCH}"
          exit 1

      - name: open-pull-request
        id: pr
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
          APPROVED: ${{ steps.resolve.outputs.approved }}
          UNCERTAIN: ${{ steps.resolve.outputs.uncertain }}
        run: |
          set -euo pipefail
          gh label create "${PR_LABEL}" \
            --color "1D76DB" \
            --description "CoinMarketCap ID mapping for newly listed symbols" \
            || true
          url="$(gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${RUN_BRANCH}" \
            --title "chore(data): CMC IDs for new Binance symbols (${APPROVED} approved, ${UNCERTAIN} uncertain)" \
            --body-file "${REPORT_PATH}" \
            --label "${PR_LABEL}")"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Pull request: ${url}"

      - name: notify-slack
        if: steps.pr.outputs.url != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          APPROVED: ${{ steps.resolve.outputs.approved }}
          UNCERTAIN: ${{ steps.resolve.outputs.uncertain }}
          UNMAPPED: ${{ steps.resolve.outputs.unmapped }}
        run: |
          set -euo pipefail
          uv run python integrations/slack_notify.py --text ":label: atlas — new Binance symbols need CMC IDs: ${APPROVED} approved, ${UNCERTAIN} uncertain, ${UNMAPPED} unmapped. Review ${PR_URL}"

      - name: fail-when-the-llm-was-configured-but-unusable
        if: steps.resolve.outputs.llm_status == 'unavailable'
        run: |
          echo "::error::The LLM endpoint is configured but unusable, so ambiguous tickers could not be adjudicated. No pull request was opened unless something was approved without it. Fix the endpoint (try mode: check-llm) and re-run."
          exit 1

      - name: warn-when-nothing-could-be-auto-approved
        if: steps.resolve.outputs.catalogue_trustworthy == 'false' || steps.resolve.outputs.exchange_prices_available == 'false'
        run: |
          echo "::warning::Nothing was auto-approved this run — catalogue_trustworthy=${{ steps.resolve.outputs.catalogue_trustworthy }} exchange_prices_available=${{ steps.resolve.outputs.exchange_prices_available }}"

      - name: notify-slack-coverage-audit
        if: steps.resolve.outputs.coverage_only == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WINDOW_DAYS: ${{ steps.resolve.outputs.window_days }}
          MISSING: ${{ steps.resolve.outputs.rows_in_window_missing_cmc_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run python integrations/slack_notify.py --text ":mag: atlas CMC coverage audit — ${MISSING} instrument row(s) from the last ${WINDOW_DAYS} days still have no CMC ID. Details: ${RUN_URL}"

      - name: job-summary
        if: always()
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -f "${REPORT_PATH:-}" ]; then
            cat "${REPORT_PATH}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${PR_URL}" ]; then
            printf '\nPull request: %s\n' "${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: notify-slack-on-failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python integrations/slack_notify.py --text ":x: atlas cmc-new-symbol-mapping workflow failed — ${RUN_URL}"
