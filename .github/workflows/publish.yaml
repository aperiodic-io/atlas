name: publish

# Publishes to PyPI when a GitHub release is published, through PyPI Trusted Publishing:
# no token or secret is stored. PyPI trusts this workflow, in the `pypi` environment.

on:
  release:
    types:
      - published

jobs:
  publish-package:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atlas-crypto-security-master
    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-uv
        uses: astral-sh/setup-uv@v5

      - name: build-package
        run: uvx hatch build

      - name: publish-package
        uses: pypa/gh-action-pypi-publish@release/v1
