name: daily-update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-security-master:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup-uv
        uses: astral-sh/setup-uv@v5

      - name: install-dependencies
        run: |
          uv pip install --system -e .

      - name: run-update
        run: uv run python atlas/update.py --source hybrid

      - name: commit-updated-jsons
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/data/*.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit"
            exit 0
          fi
          git commit -m "chore(data): daily security master update"
          git push

      - name: notify-slack-on-failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \":x: daily-update workflow failed — <${RUN_URL}|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
