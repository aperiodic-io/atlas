name: daily-update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      accept_missing:
        description: "Comma-separated exchanges whose mass delisting is real (overrides the partial-snapshot guard)"
        required: false
        default: ""

permissions:
  contents: write

# Shared with symbology-refresh: both rewrite the snapshots and push to main.
concurrency:
  group: symbology
  cancel-in-progress: false

jobs:
  update-security-master:
    runs-on: ubicloud-standard-2

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: setup-uv
        uses: astral-sh/setup-uv@v5

      - name: install-dependencies
        run: |
          uv pip install --system -e .

      - name: run-update
        env:
          ACCEPT_MISSING: ${{ inputs.accept_missing }}
        run: uv run python -m atlas.update --source exchange --accept-missing "$ACCEPT_MISSING"

      # Resolve Atlas asset IDs (base/quote/margin, unified_id) for new and
      # changed rows from CoinMarketCap's exchange market pairs. It runs even if
      # an exchange failed to refresh; a failure here fails the job (and alerts
      # Slack) but the commit step below still keeps the snapshot refresh.
      - name: build-symbology
        id: symbology
        if: always()
        run: |
          uv run python -m integrations.symbology \
            --report-path "${RUNNER_TEMP}/symbology-report.md" \
            --summary-path "${RUNNER_TEMP}/symbology-summary.json"
          cat "${RUNNER_TEMP}/symbology-report.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: commit-updated-jsons
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/data/*.json atlas/data/symbology/*.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit"
            exit 0
          fi
          git commit -m "chore(data): daily security master update"
          git pull --rebase
          git push

      - name: notify-slack-on-failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \":x: daily-update workflow failed — <${RUN_URL}|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
