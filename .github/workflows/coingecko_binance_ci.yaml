name: coingecko-binance-ci

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  populate-coingecko-ids:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: populate-coingecko-ids
        run: |
          python integrations/coingecko_metadata.py --allow-unverified --timeout-seconds 45 --max-verifications 0

      - name: commit-updated-jsons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas/data/*.json
          if git diff --cached --quiet; then
            echo "No JSON changes to commit"
            exit 0
          fi
          git commit -m "chore(data): populate coingecko ids from binance/coingecko"
          git push
